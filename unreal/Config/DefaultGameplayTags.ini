; Gameplay tags the game defines in its own code, listed here so the editor keeps them in our blueprints' pin values
; (an unknown tag would be dropped). Only the editor reads this file; nothing of it goes into the paks.
[/Script/GameplayTags.GameplayTagsSettings]
; the healing potion's cooldown effect (Bottomless Brew removes it after a drink; build_enchants.py)
+GameplayTagList=(Tag="Cooldown.SlotHealthPotion",DevComment="the game's potion cooldown")
+GameplayTagList=(Tag="GameplayCue.Hit.Melee",DevComment="the game's melee hit spark (Sweeping Edge hooks it)")
