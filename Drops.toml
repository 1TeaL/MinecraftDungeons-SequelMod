# Seasonal gear in missions - applied by the launcher when the game starts (tools/drops_patch.py). Data only.
#
# The game keeps seasonal items out of missions by a mark on the item ("belongs to seasonal event N"), which its
# loot filters turn away. For every item listed here the launcher takes that mark off and links the item to its
# family's plain item; the game then makes the item's mission list itself. Only if it doesn't is the item given
# the missions of the items on the right:  "<item>" = ["<item>", ...]  (all their missions together) - every
# seasonal item drops wherever its plain base item or any unique of that family drops (user, 2026-10-07/08).
# Item ids: tools/item_registry.json. NOT YET SEEN WORKING in game.

