# Sequel Mod - text overrides (English)
#
# Each line replaces one piece of in-game text. Keys are "Namespace/Key" from the game's text file
# (tools/game_en.json lists them all). {0}, {1} are numbers the game fills in; keep them if you want
# the game's number, drop them if it would be wrong. Delete a line to restore the original text.
# Built into the same SequelMod_P.pak by:  python tools/sequel.py build

[en]
# Ambush - the game fills {0} from its code default (20/40/60), but the mod's value is 50% per level.
# Original: "{0}% Damage Bonus"
"Enchantment/Backstabber_effect" = "+50% Damage Bonus per level"

# Fuse Shot - the 0.1 s fuse shows as "zero seconds".
# Original: "Every few shots has a timed charge that explodes {0} after impact, dealing {1} damage to nearby mobs."
"Enchantment/FuseShot_desc" = "Every few shots has a timed charge that explodes almost instantly after impact, dealing {1} damage to nearby mobs."

# Cowardice and Frenzied: their own texts again ("{0} increased ranged and melee damage" / "{0} attack speed") -
# the mod's bonus is now part of the number {0} shows (Formulas.toml), 2026-10-15.

# Apocalypse+ mission screen - the game prints the raw health/damage multiplier here. Past A+25 the mod uses that
# multiplier to slow the mobs' own growth down, so the number falls even though mobs get stronger every level.
# Originals: "{0}x mob health" / "{0}x mob damage"
"Mission/endless_struggle_mob_health" = "Mobs have more health"
"Mission/endless_struggle_mob_damage" = "Mobs deal more damage"

# Armor perks whose numbers the mod changed (SequelMod.toml, [Enchantments.Perk...]). The game fills {0} itself and
# may already show the new number; the value is written out here so the text is right either way.
# Keep these in step with the values if they change again.
# Original: "{0} healing boost"                       (25% -> 50%)
"ArmorProperties/HealingAura_description" = "50% healing boost"
# Original: "{0} movespeed aura"                      (15% -> 25%)
"ArmorProperties/MoveSpeedAura_description" = "+25% movespeed aura"
# Original: "{0} ranged damage"                       (30% -> 40%)
"ArmorProperties/RangedDamageBoost_description" = "+40% ranged damage"
# Original: "{0} chance to teleport away when hit"    (5% -> 15%)
"ArmorProperties/TeleportChance_description" = "15% chance to teleport away when hit"

# A typo in the game itself: durations of more than one second read "3 second" (seen on Poison Cloud; user, 2026-10-13).
# Original: "{0} second"
"ValuesFormat/duration_seconds_more_than_1" = "{0} seconds"

# Recycler is reworked into Ancient Alchemy (our own BP_Recycler, unreal/Scripts/build_enchants.py): a healing
# potion grants 60 / 90 / 120 souls. The tier line's {0} is Recycler's per-tier value, which Formulas.toml sets to
# 60 / 90 / 120, so it reads "60 souls" etc. (user, 2026-11-05: numbers only on the tier lines). Gravity Pulse, its
# first host, is the game's own again.
# Originals: "Recycler" / "Being hit by damage-inflicting projectiles will occasionally craft a small quiver of
# arrows." / "Every {0} projectile"
"Enchantment/Recycler" = "Ancient Alchemy"
"Enchantment/Recycler_desc" = "Using a healing potion grants souls."
"Enchantment/Recycler_effect" = "{0} souls"
# Recycler's code prints its number as an ordinal ("Every 15th projectile"), so 60 / 90 / 120 came out "60th souls"
# (user screenshot, 2026-11-05). Numbers above 20 use this one format; only Recycler's card shows ordinals that
# high, so the plain number is used. Original: "{0}th"
"ValuesFormat/ordinal_above_20" = "{0}"

# Bottomless Brew (our own BP_FoodReserves since 2026-11-08 - swapped with Barrier Brew, user; first on Food Reserves
# 2026-11-04, then Explorer). 1 / 2 / 3 extra potion drinks. Food Reserves' {0} is its food count, kept at 0
# (Formulas.toml), so the tier line is fixed text and the numbers are in the description.
# Originals: "Food Reserves" / "Whenever you use a healing potion, you also create random food items." / "{0} items crafted"
"Enchantment/FoodReserves" = "Bottomless Brew"
"Enchantment/FoodReserves_desc" = "Grants 1 / 2 / 3 extra health potion drinks at tier I / II / III. Each one comes back on its own after one potion cooldown."
"Enchantment/FoodReserves_effect" = "Extra health potion drinks"

# Sponge Strike is reworked into Shadowcloak (our own BP_SpongeStrike, unreal/Scripts/build_enchants.py): a kill has
# a 15 / 20 / 25% chance of Shadow Form (user, 2026-11-05; Dungeons II's name). The game has no tier-line text key for
# Sponge Strike (only a key the game knows can be changed), so the numbers are in the description.
# Originals: "Sponge Strike" / "Deals the damage taken, during combo, on last attack."
"Enchantment/Rushdown" = "Shadowcloak"
"Enchantment/Rushdown_desc" = "Defeating a mob has a chance to put you in Shadow Form: 15% / 20% / 25% at tier I / II / III."
# Shadowcloak's tier rows (Rushdown has no number the mod can set). Original: "200% movement speed"
"Enchantment/Rushdown_effect" = "Chance of Shadow Form when you defeat a mob"

# Knockback is reworked into Sweeping Edge (our own BP_Knockback, unreal/Scripts/build_enchants.py): melee swings hit a
# wider arc and reach further (user, 2026-11-06; Dungeons II's name). Knockback has no tier-line key, so the numbers are
# in the description. Originals: "Knockback" / "Every once in awhile, enemies will be knocked back after a melee attack."
"Enchantment/Knockback" = "Sweeping Edge"
"Enchantment/Knockback_desc" = "Every melee hit sends out a shockwave that damages the mobs around the one you hit that your swing missed."
# Its tier line: Knockback's code uses the shared "{0} chance to trigger"; the launcher points it at Blind's tier line
# instead (settings/launcher/CardTexts.toml - Blind is unused, its key held "BLIND_EFFECT"); {0} is Knockback's
# per-tier value, 0.4 / 0.6 / 0.8 in Formulas.toml.
"Enchantment/BlindMelee_effect" = "{0} splash damage"

# Shockwave and Swirling scale with your weapon (user, 2026-11-07; build_enchants.py): on top of their own damage, the
# mobs they reach take 50 / 75 / 100% of your last weapon hit. Their tier lines stay the game's (their own damage).
# Originals: "The last attack in a combo launches a shockwave, damaging enemies." / "Hitting an enemy with the last
# attack in a combo performs a swirling attack, damaging nearby enemies."
"Enchantment/Shock_desc" = "The last attack in a combo launches a shockwave that damages enemies, scaling with your weapon."
"Enchantment/Swirling_desc" = "Hitting an enemy with the last attack in a combo performs a swirling attack that damages nearby enemies, scaling with your weapon."

# Exploding: every kill credited to you explodes at once, and mobs the blast kills explode too (user, 2026-11-08;
# build_enchants.py). Original: "Mobs explode after they are defeated."
# Leeching (user, 2026-11-08): a kill by the weapon itself also triggers the game's own Leeching, so it heals twice -
# the card says so. Original: "Defeating a mob heals you a small portion of the mob's max health."
"Enchantment/Leeching_desc" = "Defeating a mob heals you a small portion of the mob's max health. Kills by your melee attacks heal twice."

"Enchantment/Exploding_desc" = "Mobs you defeat explode at once. Mobs the blast defeats explode too."

# Rampaging, Thundering: reworked 2026-11-08 (build_enchants.py). Originals: "After defeating a mob, there is a {0}
# chance to increase your attack speed by {1} for a short time." / "Has a {0} chance to summon a lightning strike that
# damages nearby enemies."
"Enchantment/Rampaging_desc" = "Defeating a mob increases your attack speed by 50% for a short time."
"Enchantment/Thundering_desc" = "Every hit summons a lightning strike that damages nearby mobs and takes 1 / 2 / 3% of their max health."

# Electrified (2026-11-08, build_enchants.py): its zap also takes a share of max health. Original: "Rolling zaps {0}
# nearby enemies with lightning bolts, dealing damage."
"Enchantment/ShockWeb_desc" = "Beams of lightning connect the last few charged arrows fired. Mobs that touch a beam take lightning damage, lose 1 / 2 / 3% of their max health and are charged for Overload."   # user, 2026-11-12. Was: ... which deal lightning damage to enemies who touch a beam.
"Enchantment/Electrified_desc" = "Rolling zaps {0} nearby mobs with lightning bolts, dealing damage and 4 / 6 / 8% of their max health."

# Lightning Focus (2026-11-08): ours boosts Thundering's, Electrified's and Overload's max-health damage too.
# Original: "The lightning damage you deal is increased."
"Enchantment/LightningFocus_desc" = "All lightning damage you deal is increased: lightning artifacts, Thundering, Electrified and Overload."

# Thorns is reworked into Overload (our own BP_Thorns, build_enchants.py; user, 2026-11-08). Its tier line's number is
# also the game's Thorns damage back (kept at 0), so the line is fixed text and the numbers are in the description.
# Originals: "Thorns" / "Whenever you take damage, you deal damage back to the attacker." / "{0} damage returned"
"Enchantment/Thorns" = "Overload"
"Enchantment/Thorns_desc" = "Lightning charges the mobs it strikes. Your hits and arrows on a charged mob take 3 / 4 / 5% of its max health and arc to up to 3 / 4 / 5 mobs around it, charging them."
"Enchantment/Thorns_effect" = "Discharges into nearby mobs"

# Levitation Shot is reworked into Relentless (our own BP_levitationShot, build_enchants.py; user, 2026-11-08). Its tier
# line's number would be the fall damage (now 0), so the line is fixed text and the numbers are in the description.
# Originals: "Levitation Shot" / "After rolling, your next attack will cause the target to levitate briefly." / "{0} Fall Damage"
"Enchantment/LevitationShot" = "Relentless"
"Enchantment/LevitationShot_desc" = "Melee hits on mobs and every arrow you shoot build up to 10 stacks. Each stack gives 2 / 3 / 4% more damage and attack speed. The stacks fade 3 seconds after your last hit."
"Enchantment/LevitationShot_effect" = "Up to 10 stacks of damage and attack speed"

# FreezingRanged is unlocked as Frost Shot (2026-11-06). The game gave it only a name - no description or tier-line key
# exists, so its card can only show the name. Original: "Freezing Ranged"
"Enchantment/FreezingRanged" = "Frost Shot"

# Gravity Pulse is reworked into Artifact Amplifier (our own BP_GravityPulse, unreal/Scripts/build_enchants.py; user,
