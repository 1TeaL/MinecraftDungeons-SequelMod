# Extra armor perks - applied by the launcher (data only). A plain Steam launch keeps the game's own perks.
# What a perk does and its numbers are fixed in the game; this only adds perks an armor doesn't have.
# Names: the game's own, see PERK_NAMES in tools/perks_patch.py (ItemCooldownDecrease = -40% artifact cooldown,
# SuperbDamageAbsorption = 35% damage reduction, MissChance = 30% negate hits, AllyDamageBoost = weapon damage aura,
# AreaHeal = potions heal allies, ItemDamageBoost = +50% artifact damage). `python tools/perks_patch.py --show` lists every armor's perks.
# Rule: keep each armor's own idea and make it better at it.
# `add` puts perks next to the armor's own; `set` replaces its whole list (seasonal armors with perks of their own).

["Armor/NatureArmor_Unique1"]          # Black Spot Armor: the potion armor -> potions come back faster
add = ["PotionCooldownDecrease"]

["Armor/WolfArmor_Unique2"]            # Black Wolf Armor: the summoner - bat, bees, weapon aura, 35% DR (2026-10-26; was beaten by Fox)
set = ["PetBat", "Beekeeper", "AllyDamageBoost", "SuperbDamageAbsorption"]

["Armor/SpelunkersArmor_Unique1"]      # Cave Crawler: the artifact armor with its bat - no weapon aura (2026-10-26, stat guide BL)
set = ["ItemDamageBoost", "ItemCooldownDecrease", "PetBat", "SuperbDamageAbsorption"]

["Armor/SpelunkersArmor_Year1"]        # Sweet Tooth: the team potion armor - its own perks, not Cave Crawler's (2026-10-26)
set = ["PotionCooldownDecrease", "AreaHeal", "HealingAura", "SuperbDamageAbsorption"]

["Armor/TurtleArmor_Unique1"]          # Nimble Turtle Armor: tanky healer -> also heals by fighting
add = ["LifeStealAura"]

["Armor/PiglinArmor_Unique1"]          # Golden Piglin Armor: artifact burst -> artifacts ready more often
add = ["ItemCooldownDecrease"]

["Armor/CowardsArmor"]                 # Guard's Armor: artifacts and arrows -> the arrows hit harder
add = ["RangedDamageBoost"]

["Armor/ArchersStrappings_Unique1"]    # Archer's Armor: ranged -> quiver artifacts ready more often
add = ["ItemCooldownDecrease"]

["Armor/WolfArmor_Unique1"]            # Fox Armor: team tank -> actually tanky
add = ["SuperbDamageAbsorption"]

["Armor/WolfArmor_Winter1"]            # Arctic Fox Armor: the ranged pet armor - its own perks, not the Fox's (2026-10-26)
set = ["RangedDamageBoost", "IncreasedArrowBundleSize", "SuperbDamageAbsorption"]

["Armor/PhantomArmor_Unique1"]         # Frost Bite: a clean ranged armor - no +50% souls (2026-10-26, stat guide C)
set = ["RangedDamageBoost", "IncreasedArrowBundleSize", "MissChance"]

["Armor/MercenaryArmor_Spooky1"]       # Hungry Horror: retaliation tank -> heals while it fights
add = ["LifeStealAura"]

["Armor/ClimbingGear_Unique1"]         # Rugged Climbing Gear: resists everything -> also shrugs off hits
add = ["MissChance"]

["Armor/EndRobes_Unique1"]             # Unstable Robes: the teleport roll gets the i-frames of the other roll armors
add = ["DodgeInvulnerability"]         # (user, 2026-10-19; stat guide D: "teleport gives no invincibility")

["Armor/SoulRobe_Unique1"]             # Souldancer Robe: a soul armor that can stand next to Wither (stat guide A)
add = ["SuperbDamageAbsorption"]       # 35% damage reduction (2026-10-19)

["Armor/GhostArmor_Spooky2"]           # Cloaked Skull: the lightning roller - ghost roll, ranged damage, negate (2026-10-26)
set = ["DodgeGhostForm", "RangedDamageBoost", "MissChance"]

["Armor/CowardsArmor_Unique1"]         # Curious Armor: the blink armor - teleport when hit, negate, fast rolls (2026-10-26;
set = ["TeleportChance", "MissChance", "DodgeSpeedIncrease", "ItemCooldownDecrease"]   # was beaten by its own Guard's Armor)
