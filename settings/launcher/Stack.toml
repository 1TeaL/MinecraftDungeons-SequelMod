# Enchantments the game may roll in more than one slot of an item (tools/stack_patch.py, applied by the launcher) -
# data only. Copies of an enchantment all fire, so a second or third pick of the same one is a real gain.
# The game's own list is short: Sharpness, Smiting, Looting, Prospector, Chains, Fire Aspect, Leeching, Rampaging,
# Radiance (melee), Cool Down, Thorns, Knockback.
#   stackable = "all"                      every enchantment that goes on gear
#   stackable = ["Swirling", "Echo"]       just these (names: tools/enchant_registry.json)
#   except                                 names left as the game has them when stackable = "all"
#
# On again (user, 2026-10-17): every enchantment whose copies were tested to add up in full (StackNotes.toml `full`)
# may roll in several slots - Reckless included (its copies multiply; user: "let Reckless roll"). Stacking one
# enchantment costs the slots the rest of the build would have used. Enchantments that only partly stack, or not at
# all, stay one per item as the game has them.

# 2026-11-12 (user: repeats dilute the pool - but don't limit builds): only enchantments whose repeats make a build
# roll in several slots - the build stackers and the damage procs. Utility / niche ones roll once per item again
# (Busy Bee, Soul Siphon, Anima Conduit, Illager's Bane, Unchanting, Infinity, Radiance Shot, Cooldown Shot, Wild
# Rage, Refreshment, Snowball, Ambush, Shadowcloak); their copies still add up when they come from built-ins, gilding
# or the bonus enchantments. Repeating rolls: base game 10% of all pools, this list 35%.
stackable = [
    # build stackers
    "CriticalHit", "Committed", "EnigmaResonatorMelee", "EnigmaResonatorRanged", "Protection", "Reckless", "FireFocus", "LightningFocus",
    "PoisonFocus", "SoulFocus", "EmeraldDivination", "Altruistic", "ThriveUnderPressure", "LevitationShot", "Barrier",
    # damage procs
    "Thundering", "Shockwave", "Swirling", "Knockback", "BonusShot", "ChainReaction", "FuseShot", "Supercharge",
    "ShockWeb", "Burning", "FireTrail", "Electrified",
]
# the game's own repeats taken away: Thorns is Overload now, and only its first copy acts
once = ["Thorns"]
except = []
