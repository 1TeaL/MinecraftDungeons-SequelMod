# Which enchantments enchanted mobs can roll - applied by the launcher when the game starts
# (tools/mobpool_patch.py). Data only; the player's own enchantments are not affected, and a boss that carries an
# enchantment by design keeps it.   python tools/mobpool_patch.py --show   lists what mobs can get right now.
#
# Every enchantment the game lets mobs roll is listed with true (rolled) or false (never rolled), so each one can be
# switched on its own (user, 2026-10-18: a setting for every mob enchantment). Set one of the "ancient mobs only"
# ones to true to let ordinary enchanted mobs roll it too - untested, but the game gives these to ancient mobs, so
# they work on a mob. Which mobs can roll what is still the game's own rule: melee, ranged or any mob.
# Names are the game's internal ones (tools/enchant_ids.json). The list follows the wiki; `--show` with the game
# running prints the real pool.

[pool]
# any mob
Burning = true
Chilling = true
# Deflecting (Deflect): in Settings.toml, section MOBS
DoubleDamage = true
Electrified = true
FastAttack = true
FireAspect = true
FireTrail = true
Freezing = true
Frenzied = true
GravityPulse = false        # mobs pulling you in; off since the first Ancient Alchemy (2026-11-04), kept off
Altruistic = false          # Heals Allies = Radiant Guard now, players only: nothing on a mob (2026-11-07)
PoisonedMelee = true        # Poison Cloud
Protection = true
Quick = true
RadianceMelee = true        # Radiance
Regeneration = true         # = Buddy Brew for players (Last Stand before 2026-11-09); on a mob still the game's own regeneration (Mob... settings)
Flee = true                 # Rush
Thorns = false              # Thorns is Overload now (user, 2026-11-08) - off on mobs
Weakening = true

# ranged mobs
Accelerating = true         # Accelerate
BonusShot = true
ChainReaction = true
CriticalHit = true
Gravity = true
Growing = true
# LevitationShot: in Settings.toml, section MOBS
MultiShot = true
Power = true
RadianceRanged = true       # Radiance Shot
RapidFire = true
Ricochet = true
TempoTheft = true
VoidTouchedRanged = true    # Void Strike

# ancient mobs only in the base game - all on since 2026-10-27 (user: variety from enchantments is fine,
# plain extra health and damage on every mob is not); false keeps one ancient-only
Committed = true
Cowardice = true
Echo = true
FuseShot = true
Huge = true
Leeching = true
Rampaging = true
Sharpness = true
Shockwave = true
Swirling = true
Thundering = true
