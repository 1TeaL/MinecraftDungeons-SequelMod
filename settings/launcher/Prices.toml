# Merchant prices - applied by the launcher while the game runs (tools/prices_patch.py). Data only.
#
# Each line multiplies one merchant's base price (and its restock price, if it has one). 1 = the game's own.
# Not tied to Apocalypse levels: it holds on every difficulty.
# Merchants: enchantmentmerchant (Enchantsmith), piglinmerchant, shopkeeper (Village Merchant), luxurymerchant,
# mysterymerchant, blacksmith, giftwrapper. The first two take gold, the rest emeralds.

# enchantmentmerchant (rerolls, base 20 gold) and piglinmerchant (gilded gear, base 12 gold, restock 5): in
# Settings.toml, section PRICES. The other merchants can be listed here.
