# Lanes (2026-10-10). Enchantments that deal their own damage (Fire Aspect, Poison Cloud, Thundering, Shockwave,
# Swirling) take the kill from the weapon, which switches off whatever needs the kill (Leeching, Exploding,
# Rampaging, Refreshment, Prospector, Busy Bee, Rushdown). So a list stays in one lane: PROC (the enchantments do
# the killing) or ON-KILL (the weapon hit does), each filled up with ones that don't care: Critical Hit, Committed,
# Void Strike, Echo, Stunning, Chains, Weakening, Sharpness.
# Void Strike goes on the slow, heavy weapons, where the mark has time to grow between hits (user, 2026-10-10).
# Firebrand, Stormlander and Venom Glaive were slowed down and made heavier for it (SequelGear.toml).
# Open: the wiki says damage from another source (a burn or poison tick) cashes the mark in early; the user
# says it does not. To check in play on the Firebrand.
# A name ending in "!" is a second copy of the item's own built-in - copies all fire, so its signature doubles.
# Not for Poison Cloud, Exploding or Echo: their copies proc but add nothing (tested 2026-10-13), so those four
# uniques got another enchantment in place of the copy.
