# Bonus built-in enchantments for gear above the cap - applied by the launcher while the game runs (bonus_watch.py).
#
# Gear stops getting stronger at power 316 (as shown in game). Past that, every `step` power points is one upgrade
# step for that item type:
#   first   its own built-in enchantments rise one tier per step until they are tier 3
#   then    its three bonus enchantments, one tier per step: 1st to tier 3, then the 2nd, then the 3rd
# With step = 4 that is 12 steps between 320 and 364: enough for an item that starts with a tier 1 built-in.
# Bonuses are built-ins: shown on the tooltip, no enchantment points. Copies of one enchantment all fire (tested in
# play, also at the same tier), so a bonus adds to the same enchantment picked by the player - a pick is never wasted.
# A bonus the item already has built in is skipped; a list may hold more than three names, the first three the item
# doesn't own are used.
# At power `final` (only A+100 drops it) weapons and bows get one more bonus enchantment, at tier 3 straight away:
# the next name of the list (the last name of each list is there for that).
# Weapons and bows: one list per family, picked to fit how it plays. Armor: the same defensive three for all.
# Built-ins belong to the item type, not the single item: the launcher goes by the best copy the player holds.

[thresholds]
cap = 316        # power shown in game where gear stops getting stronger
step = 4
total = 4        # every item ends with this many enchantments beyond its family's plain item, bonuses included:
                 # a unique with one of its own gets three bonuses, one with two gets two (never fewer than one)
final = 365       # A+100 gear: weapons and bows get a fourth bonus enchantment (user, 2026-10-06)

# The A+100 extra (power `final`) of every item in a section, before its list is looked at - unless the item has it
# already, then the list's next name as before. Unchanting adds damage against enchanted mobs, which are everywhere
# late in Endless, and its copies stack; it suits fast and heavy weapons alike (user, 2026-10-14).
[final_extra]
melee = "Unchanting"

# The A+100 ladder (user, 2026-10-14: a for-fun climb after everything is set in stone). Past power `final`, every
# `step` power adds one tier of a plain damage (or defence) enchantment as new lines under all the others: tier I,
# II, III, then a second line I, II, III... Copies of these three all stack. Gear has room for 16 enchantments.
# climb: an A+100 drop comes in this many points above your power level (the save's gear power), so the number
# keeps creeping up run by run - drops already above that are left as they are.
[ladder]
step = 5
climb = [1, 3]
melee = "Sharpness"
ranged = "Power"
armor = "Protection"

# Lists revised 2026-10-14 (user: aim for enchantments whose copies stack, since a bonus may land on something the
