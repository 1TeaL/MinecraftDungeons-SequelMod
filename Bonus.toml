# Gilded gear as the reward for entering Endless (user, 2026-10-06): from `from_power` up - about A+26 - each weapon,
# bow or armor has `chance` to be gilded, i.e. to carry one extra enchantment that costs no points, at tier 1, 2
# or 3 with the chances given. Which enchantment: see `pool`. Decided once per item (from its name and
# exact power), stored on the item and saved by the game; items that are gilded already are left alone.
# Only new drops (user, 2026-10-06): items that were in the character saves when the launcher started never
# change. An item whose power changes (Blacksmith upgrade) counts as new.
# The bonus enchantments themselves start at the gear cap (316), as before.
[gilded]
from_power = 257
pool = "any"      # "any": any enchantment that can roll on that kind of gear, like the game's own gilded items
                  # "list": only the names of the item's bonus list above
chance = 0.2
tier_chances = [0.5, 0.35, 0.15]

# Merchant stock (user, 2026-10-07: 'whatever formula they had before but just scale beyond base game'): the game
# stocks its shops near the hero's power level, but stops counting at about power 254 (A+25). With this on, the
# game still picks the stock; the weapons and armor on the shelves of the Village, Luxury and Piglin merchants are
# then moved up by (your power level - game_ceiling), so each merchant keeps its own spread around your level.
# Your power level is what the save records as the gear power. Shelf items do not count for the bonus
# enchantments until you buy them. The Blacksmith's slot and Tower rewards are never touched.
[merchants]
follow_power = true
game_ceiling = 254

# Blacksmith (user, 2026-10-14: "so it matches my power"): the game sets an upgrade's power from the difficulty of
# the missions won, and its difficulties end at A+25. With this on, a collected upgrade below your power level (the
# save's gear power, as for the merchants) is raised to it, once, after the game next saves. Never lowered.
[blacksmith]
match_power = true
