# Extra perks for armor above the cap. Unlike the enchantments these go on the single armor (the game saves them with
# it), one more at each power level listed. Reworked 2026-10-07 after the Wiper "every armor stat" ranking: before,
# most armors got the same top traits. Now each list reads
#     [its archetype's perk, 35% damage reduction, a second archetype perk, spares...]
# and an armor takes the first ones it doesn't have. So every armor gains damage reduction by the middle level
# (mob damage rises past A+50, health doesn't - user), and one that already has it moves on to its second
# archetype perk and then to the first spare (30% chance to negate hits, then life steal).
