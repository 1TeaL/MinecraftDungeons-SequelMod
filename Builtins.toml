# ---- Seasonal items as uniques of their own, 2026-10-08 (user: a build their counterpart doesn't do) ----
# Each replaces the built-in copied from another unique and adds a second one. SharedPain, Rushdown and ShadowShot
# are effects the game uses on one or two items only: they are here as tests and stay only if they work.
# Seasonal items are worth the same as an ordinary unique (user, 2026-10-14): one enchantment at tier 3, or two at
# tier 2 where the playstyle needs both - the same six enchantment points either way. Above the gear cap every
# built-in climbs to tier 3 like any other. Two were set by the user item by item: the Bonehead Hammer (two at
# tier 1, less hit damage) and the Shrieking Crossbow (Tempo Theft 2 beside Shadow Shot 1).
["MeleeWeapons/Sword_Spooky1"]            # Sinister Sword: sustain sword
CriticalHit = { to = "Leeching", level = 2 }
add = { Leeching = 2, RadianceMelee = 2 }

["MeleeWeapons/Claymore_Winter1"]         # Frost Slayer: frontline tank - slow the pack, every kill makes you tougher
Sharpness = { to = "Freezing", level = 2 }
add = { Freezing = 2, GuardingStrike = 2 }         # (was Freezing 3 + Shared Pain 1)

["MeleeWeapons/Cutlass_Year1"]            # Sparkler: artifact duelist - fire an artifact, then land a big hit
Rampaging = { to = "DamageSynergy", level = 3 }    # (was Thundering 3 + Critical Hit 2, too close to Stormlander)
add = { DamageSynergy = 3 }

["MeleeWeapons/SoulScythe_Spooky2"]       # Skull Scythe: soul crit
Freezing = { to = "EnigmaResonatorMelee", level = 2 }
add = { EnigmaResonatorMelee = 2, SoulSiphon = 2 }

["MeleeWeapons/Glaive_Spooky2"]           # Cackling Broom: pull and sweep
Smiting = { to = "Swirling", level = 2 }
add = { Swirling = 2, GravityMelee = 2 }

["MeleeWeapons/Spear_spooky2"]            # Spine-Chill Spear: mark and execute
Echo = { to = "VoidTouchedMelee", level = 3 }
add = { VoidTouchedMelee = 3 }

["RangedWeapons/SoulBow_Winter1"]         # Shivering Bow: heals through souls
TempoTheft = { to = "AnimaConduitRanged", level = 2 }
add = { AnimaConduitRanged = 2, SoulSiphon = 2 }

["RangedWeapons/Trickbow_Year1"]          # Sugar Rush: ramping fire rate
WildRage = { to = "Accelerating", level = 3 }
add = { Accelerating = 3 }

["RangedWeapons/SlowBow_Spooky2"]         # Webbed Bow: trap bow
add = { ShockWeb = 2, Gravity = 2 }

["RangedWeapons/BubbleBow_Spooky2"]       # Gloopy Bow: utility bow - shots bring artifacts and potions back sooner
ReliableRicochet = { to = "CooldownShot", level = 2 }   # (was Poison Cloud 3 + Chain Reaction 2, a third poison bow)
add = { CooldownShot = 2, PotionThirstRanged = 2 }

["Armor/MercenaryArmor_Spooky1"]          # Hungry Horror: retaliation tank - pulls mobs in to hurt themselves on it
add = { Thorns = 2, GravityPulse = 2 }

["Armor/MercenaryArmor_Spooky2"]          # Hungriest Horror: low-health berserker
add = { Reckless = 2, Frenzied = 2 }

["Armor/WolfArmor_Winter1"]               # Arctic Fox Armor: pack leader
add = { BeastBurst = 2, BeastSurge = 2 }

["Armor/SpelunkersArmor_Year1"]           # Sweet Tooth: consumables
add = { SurpriseGift = 2, FoodReserves = 2 }

["Armor/FullPlateArmor_Spooky2"]          # Cauldron Armor: furnace tank
add = { Burning = 2, FireFocus = 2 }

["Armor/GrimArmor_Spooky2"]               # The Spooky Gourdian: last stand
add = { FinalShout = 2, DeathBarter = 2 }

["Armor/GhostArmor_Spooky2"]              # Cloaked Skull: roll zapper
FireTrail = { to = "Electrified", level = 2 }
add = { Electrified = 2, MultiDodge = 2 }

# ---- B-tier pass, 2026-10-08: only the B items the mod had not touched yet ----
["MeleeWeapons/Spear_Unique1"]            # Whispering Spear: its Echo at tier 3 (0.1 s gap; tier 1 = 2.1 s)
Echo = 3

["MeleeWeapons/Spear_Unique2"]            # Fortune Spear
Looting = 3
add = { Committed = 2 }
["MeleeWeapons/Backstabber_Unique1"]      # Swift Striker: every built-in Echo is tier 3 (user, 2026-10-12: Echo is weak)
Echo = 3

["MeleeWeapons/SkeletonHammer"]           # Bonehead Hammer: pull and detonate - keeps its Gravity and adds Exploding, paid for
add = { Exploding = 1 }                   # with hit damage (100 against the Hammer of Gravity's 120, SequelGear.toml) - user, 2026-10-13

["RangedWeapons/BatCrossbow"]             # Shrieking Crossbow: a sidegrade to the Veiled Crossbow - Shadow Shot plus
ShadowBarbRanged = { to = "TempoTheft", level = 2 }   # Tempo Theft where the Veiled has Shadow Barb; same stats (user, 2026-10-13)

