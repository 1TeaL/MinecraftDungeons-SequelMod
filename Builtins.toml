# Built-in enchantments of unique items - applied by the launcher (Play Endless Apocalypse.bat,
# steam_launch.bat or tools/play.py). A plain Steam launch keeps the game's own built-ins.
#
# Format, one table per item ("<category>/<item id>", see tools/item_registry.json):
#   <Enchantment> = <level 1-3>                              raise or lower a built-in's tier
#   <Enchantment> = { to = "<Enchantment>", level = <1-3> }  replace it with another enchantment
# Enchantment names are the game's internal ones (tools/enchant_ids.json), e.g. PoisonedMelee = Poison Cloud,
# EmeraldDivination = Lucky Explorer, EnigmaResonatorMelee = Enigma Resonator.
# Changes apply on the next launch; the in-game text follows the level automatically.

["MeleeWeapons/Axe_Unique1"]           # Firebrand
FireAspect = 3

["MeleeWeapons/Axe_Unique2"]           # Highland Axe
