# Quality-of-life changes, applied by the launcher when the game starts (data only, no game code).

# Blacksmith: how many missions an item upgrade takes (the game's own number is 3).
# The Blacksmith's description in game still says 3; that text can't be changed.
[blacksmith]
missions = 1

# Skip the early campaign (user, 2026-10-27: get into the fun fast). start = "apocalypse" unlocks Apocalypse,
# "adventure" unlocks Adventure (skips only Default), "off" plays from Default as normal. A character that hasn't
# reached that difficulty gets it unlocked, and - if its gear is weaker - a starter kit at that difficulty's opening
# power (Apocalypse I is about 70, VII about 105; Adventure I's 30 is an estimate). Plain gear with fresh enchantment
# options. Done by the launcher while the game is closed: a character made in this session is ready the next start.
[start]
start = "apocalypse"
kit_power = { apocalypse = 70, adventure = 30 }
kit = ["Sword", "Bow", "ScaleMail", "FireworksArrowItem", "IronHideAmulet", "DeathCapMushroom"]
