# Endless Apocalypse: what the Apocalypse+ table does past A+25.
#
# Only matters when the launcher raises the cap (python tools/play.py --endless). A+1-25 are never
# changed by this file, and a normal Steam launch (25 levels) plays exactly as if it wasn't here.
# Everything here is built into the pak; the launcher only raises the level cap.
#
# Per stat (row of [Difficulty.EndlessStruggle] in SequelMod.toml), one of:
#   "freeze"                 keep the A+25 value - the game's own behaviour, and the default
#   "grow"                   keep changing at the same per-level rate as A+1-25
#   <number>                 straight line from the A+25 value to this value at A+99
#   { from = 30, to = 1.5 }  a stat that's off up to A+25: starts at A+<from>, reaches <to> at A+99
#                            (add until = 85 to reach <to> at A+85 and stay there)
#   [[85, 2.25], [100, 1.5]] straight lines from the A+25 value through these [level, value] points
#                            (multipliers start from 1.0, chances from 0)
#
# Build with: python tools/sequel.py build   (rebuild after switching profile)

profile = "natural"

# Gear and mob power past A+25. The game stops both gear and mobs getting stronger at one fixed point, gear power
# 315 (stored value; the game shows it as 316). Design (2026-10-05):
#   A+26 .. cap_level   gear climbs from 254 to that cap, mobs keep pace.
#   after cap_level     the power number only counts up to top_power at A+100. Gear is no stronger for it, but
#                       the launcher gives gear above the cap bonus built-in enchantments step by step
#                       (Bonus.toml), and the profile's mob health/damage values rise to match.
# mode: "slow" (this design), "natural" (the game's own pace until the cap, flat after), "off".
[power]
mode = "slow"
cap_level = 38
top_power = 365

# A+100, the finale: values of its own for that one level. Any stat of the A+ table can be listed.
# Mob modifiers are left alone here (user, 2026-10-05): the finale is simply the top of the climb, with better rewards.
[finale]
LootQualityBoost = 100.0           # rarity rerolls; 18 at A+99
XPMultiplier = 10.0                # 5 at A+99

# Trials: `levels` levels ending at `level` (a whole unlock block: 56-58, 65-67, 74-76, 83-85, 92-94; user,
# 2026-10-12: with gear capped at A+38 there is room for trials to last longer) where a stat jumps to a multiple of
# its A+100 value, and is back on its curve at the next level. Each previews one piece of the finale, slightly above it (user, 2026-10-06: A+100 is everything at once,
# so a single stat can go a bit higher). Any row that changes past A+25 can be listed: <row> = <times the A+100 value>.
# Trials pay better too: loot quality at half the finale's, XP at 0.7 of it.
# Each sits on the top level of an unlock block (58, 67, 76, 85, 94: every third block from A+50, see [unlock] tops), the level whose
# boss missions open the next block, so a trial can't be skipped and a block never changes character halfway.
[[trial]]
level = 58
levels = 3
name = 'The Horde'
MobCountMultiplier = 1.15
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 67
levels = 3
name = 'The Enchanted'
EnchantedMobChanceMultiplier = 1.15
EnchantedMobPowerMultiplier = 1.15
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 76
levels = 3
name = 'The Undying'
MobResurrectionChance = 2.0
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 85
levels = 3
name = 'The Titans'      # the damage check: can the build still kill
MobMaxHealthMultiplier = 1.25
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 94
levels = 3
name = 'The Berserkers'      # the survival check, last stop before the A+95-100 run
MobDamageMultiplier = 1.3
LootQualityBoost = 0.5
XPMultiplier = 0.7

# The final run (user, 2026-10-12): A+95-99 go through the five trials once more, one level each, before A+100
# puts everything together.
[[trial]]
level = 95
name = 'The Horde'
MobCountMultiplier = 1.15
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 96
name = 'The Enchanted'
EnchantedMobChanceMultiplier = 1.15
EnchantedMobPowerMultiplier = 1.15
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 97
name = 'The Undying'
MobResurrectionChance = 2.0
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 98
name = 'The Titans'
MobMaxHealthMultiplier = 1.25
LootQualityBoost = 0.5
XPMultiplier = 0.7

[[trial]]
level = 99
name = 'The Berserkers'
MobDamageMultiplier = 1.3
LootQualityBoost = 0.5
XPMultiplier = 0.7

# How A+26 and up unlock (applied by the launcher when the game starts).
#   staged = true    like A+1-25: beat `bosses` different boss missions on your top unlocked level to open
#                    the next `levels_per_step` levels; `finale_bosses` on A+99 open A+100. The game's list
#                    has room for 24 more steps, so with 3 per step the steps from A+79 on open 4 levels.
#   staged = false   everything up to A+100 opens together with A+25
[unlock]
staged = true         # (false = all levels open together with A+25, for testing)
levels_per_step = 3
# The blocks, as the top level each step opens (user, 2026-10-10). The game's own list has room for 24 steps, and
# this uses exactly 24, so no longer list has to be swapped in:
#   A+26-49   five big blocks (5, 5, 5, 5, 4 levels) - the gear climb goes quickly
#   A+50-94   always 3 levels, every third block ending on a trial level, 9 levels apart
#   A+95-100  the final run in four steps: 95-96, 97-98, 99, 100
tops = [30, 35, 40, 45, 49,  52, 55, 58,  61, 64, 67,  70, 73, 76,  79, 82, 85,  88, 91, 94,  96, 98, 99, 100]
bosses = 3
# Key levels (user, 2026-10-10): as in the base game, where A+22-25 took 7 bosses, the gates that matter ask for
# more - the level before the breaking point and the five trial levels. Each must be a block's top level.
key_levels = [58, 67, 76, 85, 94, 96, 98]   # the trial levels, and every step of the final run (user)
key_bosses = 7         # the most an ordinary or trial step asks for, as in the base game
major_levels = [25]       # the big breakpoint into Endless (A+26). (A+40 / A+49 asked for 10 too until 2026-10-13: nothing
                          # visibly changes there, so it read as an arbitrary wall - user)
major_bosses = 10      # of the 14 boss missions there are with all DLC (user, 2026-10-10: 9 or 10 for these)
finale_bosses = 10     # A+99 -> A+100, the third big breakpoint
ramp = true            # the steps between key levels ask for ramp_from, then one more each step up to key_bosses, and
ramp_from = 3          # start over at ramp_from after reaching it or after a key level (user: a 3 to 7 range).
# Counts of their own: the step before each trial block asks for 5, so a trial cycle reads 3 - 5 - 7 instead of
# 3 - 4 - 7 (user, 2026-10-13). "<level cleared>" = <boss missions>
level_bosses = { "55" = 5, "64" = 5, "73" = 5, "82" = 5, "91" = 5 }
                       # ramp = false: `bosses` on every such step.

# Regular mobs drop gold past A+25 only. The chance climbs in a straight line between the two values.
# OFF for now: the way it edited the mission map crashed the game when starting a mission.
[gold]
enabled = false
chance_at_26 = 0.02
chance_at_99 = 0.08
min_amount = 1
max_amount = 3

# Gets harder at the game's own A+ pace: health/damage 1.5x at A+25 -> 3x at A+99 against matching gear.
[natural]
# Mob health and damage: the game's own multiplier, 1.5 at A+25. Flat while gear keeps pace (to A+38); after that it
# is the whole difficulty climb, sized to what a fully upgraded character gains from the bonus enchantments
# (estimated 2-2.7x damage, 1.5-2x survivability) plus some challenge: health x5 and damage x2.2 by A+100
# (health raised from x3 once artifacts could scale too - ArtifactScaling.toml follows the same x5).
MobMaxHealthMultiplier = [[38, 1.5], [100, 7.5]]   # x5 by A+100 (was x6 for a day)
MobDamageMultiplier = [[38, 1.5], [100, 4.5]]     # x3 by A+100 (was x2.5). User, 2026-10-13: the difficulty should ask for
                                                  # skill, Monster Hunter style - "you do more damage but you take more":
                                                  # growth moved from mob health to mob damage
# Handed back to the player past the cap (at their A+25 values up to A+38, never harsher than that):
PlayerReceiveHealingMultiplier = [[38, 0.7], [100, 1.0]]   # healing received: 70% -> 100% (user, 2026-10-13: healing in
                                                           # time is part of the skill of surviving the higher damage)
# Stuns and stagger stay at their A+25 values (30% stun duration, 10x stagger resistance) all the way (user, 2026-10-16).
MobPushbackMultiplier = [[38, 0.3], [100, 0.6]]            # knockback on mobs 30% -> 60%
# Mob speed: the game's own 1.85x at A+25, held to A+38, then up to 2x by A+100 (user, 2026-10-16 - the one row of
# these four allowed past its A+25 value).
MobSpeedMultiplier = [[38, 1.85], [100, 2.0]]
LootQualityBoost = 18.0            # 4.1 at A+25: more uniques / gilded
EnchantedMobChanceMultiplier = "grow"
EnchantedMobPowerMultiplier = "grow"
XPMultiplier = 5.0                 # x2 at A+25 now (A+1-25 rewards, user 2026-10-27), x5 by A+99
MobCountMultiplier = { from = 30, to = 1.4 }
MobResurrectionChance = { from = 40, to = 0.1 }

# Much steeper: health/damage 1.5x at A+25 -> 6.75x at A+99 (on top of [power]).
[climb]
MobMaxHealthMultiplier = 6.75
MobDamageMultiplier = 6.75
LootQualityBoost = 18.0            # 4.1 at A+25: more uniques / gilded
EnchantedMobChanceMultiplier = "grow"
EnchantedMobPowerMultiplier = "grow"
XPMultiplier = 5.0                 # x2 at A+25 now (A+1-25 rewards, user 2026-10-27), x5 by A+99
MobCountMultiplier = { from = 30, to = 1.5 }
MobResurrectionChance = { from = 40, to = 0.1 }
