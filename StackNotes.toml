# What happens when one item carries several copies of the same enchantment (a built-in one plus chosen ones, or the
# same pick in more than one slot). Tested in game by the user on 2026-10-13; shown in CHANGES.md and on the shared
# page (tools/change_sheet.py). Names: tools/enchant_ids.json.

